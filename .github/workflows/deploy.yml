name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else cd sadhu_portfolio && npm ci; fi

      - name: Build static export
        env:
          # For Hostinger root hosting, usually no base path
          BASE_PATH: ''
        run: |
          if [ -f package.json ]; then npm run build; else cd sadhu_portfolio && npm run build; fi

      - name: Upload via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: sftp
          local-dir: out/
          server-dir: ${{ secrets.SFTP_REMOTE_PATH }}/
          # safer default: do not delete remote files
          dangerous-clean-slate: false


