name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # For Hostinger root hosting, usually no base path
          BASE_PATH: ''
        run: npm run build

      - name: Cleanup remote old out/ folder (safe)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: |
            set -e
            TARGET="${{ secrets.SFTP_REMOTE_PATH }}"
            if [ -d "$TARGET/out" ]; then rm -rf "$TARGET/out"; fi

      - name: Upload static export (out/**)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: |
            out/**
          target: ${{ secrets.SFTP_REMOTE_PATH }}
          overwrite: true
          strip_components: 1
          timeout: 300s

      - name: Upload PHP admin/API utilities (public/**)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: |
            public/**
          target: ${{ secrets.SFTP_REMOTE_PATH }}
          overwrite: true
          strip_components: 1
          timeout: 300s


