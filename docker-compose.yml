services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@postgres:5432/portfolio
      MEDIA_ROOT: /data/media
      PORTFOLIO_ROOT: /portfolio
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    volumes:
      - media:/data/media
      - ./data:/portfolio/data:ro
      - ./public:/portfolio/public:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_API_URL: ""
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
